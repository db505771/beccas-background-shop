<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

<title>Backgrounds</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0 !important;
    padding: 0 !important;

    width: 100%;
    min-height: 100vh;

    background: transparent !important;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    color: #ffffff;

    -webkit-tap-highlight-color: transparent;

    overflow-x: hidden;
}

/* SCROLLING ENABLED */
body {
    padding: 16px !important;

    overflow-y: auto !important;

    -webkit-overflow-scrolling: touch;
}


/* =====================================
   CATEGORY BUTTONS
===================================== */

.category-container {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

    width: 100%;
    max-width: 600px;

    margin: 0 auto 14px;
}


.category-button {

    height: 50px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 28px;

    color: #ffffff;

    font-size: 0.95rem;
    font-weight: 600;

    cursor: pointer;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.14),
            rgba(255,255,255,0.07)
        );

    border:
        1px solid rgba(255,255,255,0.08);

    backdrop-filter:
        blur(22px)
        saturate(180%);

    -webkit-backdrop-filter:
        blur(22px)
        saturate(180%);

    box-shadow:
        inset 0 1px 1px
        rgba(255,255,255,0.10);

    transition:
        transform 0.15s ease,
        background 0.15s ease,
        border 0.15s ease;
}


.category-button:active {

    transform: scale(0.97);

}


.category-button.selected {

    border:
        1px solid
        rgba(255,255,255,0.95);

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.18),
            rgba(255,255,255,0.09)
        );

    box-shadow:
        inset 0 1px 1px
        rgba(255,255,255,0.16);
}


/* =====================================
   BACKGROUND GRID
===================================== */

.shop-grid {

    display: grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0, 1fr)
        );

    gap: 8px;

    width: 100%;

    max-width: 1000px;

    margin: 0 auto;

    padding-bottom: 20px;
}


/* =====================================
   BACKGROUND PILL
===================================== */

.card {

    width: 100%;

    min-height: 52px;

    padding:
        5px
        10px
        5px
        6px;

    display: flex;

    align-items: center;

    border-radius: 30px;

    cursor: pointer;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.14),
            rgba(255,255,255,0.07)
        );

    border:
        1px solid
        rgba(255,255,255,0.08);

    backdrop-filter:
        blur(22px)
        saturate(180%);

    -webkit-backdrop-filter:
        blur(22px)
        saturate(180%);

    box-shadow:
        inset 0 1px 1px
        rgba(255,255,255,0.10),

        0 2px 8px
        rgba(0,0,0,0.08);

    transition:
        transform 0.15s ease,
        background 0.15s ease,
        border 0.15s ease;

    overflow: hidden;
}


.card:active {

    transform: scale(0.96);

}


/* =====================================
   EQUIPPED
===================================== */

.card.equipped {

    border:
        1px solid
        rgba(255,255,255,0.95);

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.18),
            rgba(255,255,255,0.08)
        );

    box-shadow:
        inset 0 1px 1px
        rgba(255,255,255,0.18);
}


/* =====================================
   PREVIEW
===================================== */

.preview {

    flex-shrink: 0;

    width: 40px;
    height: 40px;

    border-radius: 50%;

    margin-right: 8px;

    border:
        1px solid
        rgba(255,255,255,0.20);

    box-shadow:

        inset 0 1px 2px
        rgba(255,255,255,0.20),

        inset 0 -1px 2px
        rgba(0,0,0,0.12);

    overflow: hidden;
}


/* =====================================
   NAME
===================================== */

.item-name {

    min-width: 0;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    font-size: 0.85rem;

    font-weight: 600;
}


/* =====================================
   LARGER SCREENS
===================================== */

@media (min-width: 700px) {

    .shop-grid {

        grid-template-columns:
            repeat(
                3,
                minmax(0, 1fr)
            );

        gap: 10px;
    }


    .card {

        min-height: 56px;
    }


    .preview {

        width: 44px;
        height: 44px;
    }


    .item-name {

        font-size: 0.95rem;
    }

}

</style>

</head>

/* =====================================
   STATE
===================================== */

let equippedConfig = {

    type: "Solid",

    color: "#0d0d11",

    middleColor: "",

    endColor: ""

};


let currentCategory = "Default";


/* =====================================
   BACKGROUND CSS
===================================== */

function getCssBackground(item) {

    if (
        item.type === "Gradient"
    ) {

        return `
            linear-gradient(
                135deg,
                ${item.color},
                ${item.middle},
                ${item.end}
            )
        `;

    }

    return item.color;

}


/* =====================================
   CATEGORY
===================================== */

function switchCategory(category) {

    currentCategory = category;


    document
        .getElementById("default-button")
        .classList.toggle(
            "selected",
            category === "Default"
        );


    document
        .getElementById("gradient-button")
        .classList.toggle(
            "selected",
            category === "Gradient"
        );


    updateDisplay();

}


/* =====================================
   CHECK EQUIPPED
===================================== */

function checkIsEquipped(item) {

    if (
        item.type !==
        equippedConfig.type
    ) {

        return false;

    }


    if (
        item.color !==
        equippedConfig.color
    ) {

        return false;

    }


    if (
        item.type === "Gradient"
    ) {

        return (

            item.middle ===
            equippedConfig.middleColor

            &&

            item.end ===
            equippedConfig.endColor

        );

    }


    return true;

}


/* =====================================
   DISPLAY
===================================== */

function updateDisplay() {

    const container =
        document.getElementById(
            "shop-container"
        );


    container.innerHTML = "";


    const filteredItems =
        shopItems.filter(item => {

            if (
                currentCategory ===
                "Default"
            ) {

                return (
                    item.type ===
                    "Solid"
                );

            }


            return (
                item.type ===
                "Gradient"
            );

        });


    filteredItems.forEach(item => {

        const card =
            document.createElement(
                "div"
            );


        const isEquipped =
            checkIsEquipped(item);


        card.className =
            "card" +
            (
                isEquipped
                    ? " equipped"
                    : ""
            );


        const bgStyle =
            getCssBackground(item);


        card.innerHTML = `

            <div
                class="preview"
                style="
                    background:
                    ${bgStyle};
                "
            ></div>

            <div class="item-name">
                ${item.name}
            </div>

        `;


        card.onclick =
            function() {

                equipBackground(item);

            };


        container.appendChild(card);

    });

}


/* =====================================
   EQUIP
===================================== */

function equipBackground(item) {

    equippedConfig = {

        type:
            item.type,

        color:
            item.color,

        middleColor:
            item.middle || "",

        endColor:
            item.end || ""

    };


    applyEquippedStyle(
        equippedConfig
    );


    updateDisplay();


    sendEquipRequest(item)
        .catch(error => {

            console.error(
                "Equip sync error:",
                error
            );

        });

}


/* =====================================
   APPLY BACKGROUND
===================================== */

function applyEquippedStyle(config) {

    let bgStyle;


    if (
        config.type ===
        "Gradient"
    ) {

        bgStyle = `
            linear-gradient(
                135deg,
                ${config.color},
                ${config.middleColor},
                ${config.endColor}
            )
        `;

    } else {

        bgStyle =
            config.color;

    }


    document.body.style.background =
        bgStyle;


    localStorage.setItem(
        "equipped_bg",
        bgStyle
    );

}


/* =====================================
   GOOGLE SHEETS
===================================== */

function sendEquipRequest(item) {

    return fetch(
        API_URL,
        {

            method: "POST",

            redirect: "follow",

            headers: {

                "Content-Type":
                    "text/plain;charset=utf-8"

            },

            body:
                JSON.stringify({

                    action:
                        "equip",

                    type:
                        item.type,

                    color:
                        item.color,

                    middle:
                        item.middle || "",

                    end:
                        item.end || ""

                })

        }
    );

}


/* =====================================
   LOAD SAVED BACKGROUND
===================================== */

async function loadSheetData() {

    try {

        const response =
            await fetch(API_URL);


        const data =
            await response.json();


        if (
            data.success &&
            data.equipped
        ) {

            equippedConfig =
                data.equipped;


            applyEquippedStyle(
                equippedConfig
            );

        }


        updateDisplay();


    } catch (error) {

        console.error(
            "Failed to load background:",
            error
        );


        updateDisplay();

    }

}


/* =====================================
   START
===================================== */

loadSheetData();
